<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نجم MVP</title>

<style>

body{
margin:0;
background:black;
font-family:Tahoma;
overflow:hidden;
}

/* ===== تسجيل الدخول ===== */
.auth{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#0f172a;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:10px;
z-index:99999;
}

.auth input{
padding:12px;
width:200px;
border:none;
border-radius:10px;
}

.auth button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#22c55e;
color:#fff;
}

/* ===== الفيديو ===== */
.feed{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

.video-item{
height:100vh;
position:relative;
scroll-snap-align:start;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

/* ===== أزرار التفاعل ===== */
.actions{
position:absolute;
right:15px;
bottom:120px;
display:flex;
flex-direction:column;
gap:12px;
z-index:10;
}

.actions button{
width:50px;
height:50px;
border-radius:50%;
border:none;
background:rgba(0,0,0,0.5);
color:#fff;
font-size:20px;
}

/* ===== أعلى ===== */
.top-bar{
position:fixed;
top:10px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 15px;
z-index:999;
}

.btn{
padding:8px 12px;
border:none;
border-radius:20px;
background:rgba(255,255,255,0.2);
color:#fff;
}

/* ===== زر + ===== */
.fab{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:60px;
height:60px;
border-radius:50%;
background:#22c55e;
color:#fff;
font-size:30px;
border:none;
z-index:999;
}

.comment-box{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#fff;
display:none;
padding:10px;
}

</style>
</head>

<body>

<!-- ===== تسجيل الدخول (MVP بسيط) ===== -->
class="auth" id="auth">
  <h2 style="color:white;">نجم</h2>
  <input id="user" placeholder="اسم المستخدم">
  <button onclick="login()">دخول</button>
</div>

<!-- ===== أعلى الشاشة ===== -->
<div class="top-bar">
  <button class="btn">👤 الحساب</button>
  <button class="btn">+ رفع</button>
</div>

<!-- ===== الفيديو ===== -->
<div class="feed">

  <div class="video-item">

    <video autoplay muted loop>
      <source src="video1.mp4">
    </video>

    <div class="actions">
      <button onclick="like()">❤️</button>
      <button onclick="comment()">💬</button>
      <button onclick="share()">🔗</button>
    </div>

  </div>

</div>

<!-- ===== زر + ===== -->
<button class="fab" onclick="camera()">+</button>

<!-- ===== تعليق ===== -->
<div class="comment-box" id="commentBox">
  <input placeholder="اكتب تعليق..." style="width:80%;padding:10px;">
  <button onclick="closeComment()">إرسال</button>
</div>

<script>

</body>
</html>
