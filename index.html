<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نجم</title>
<body>

<div class="feed">

  <!-- هنا تلصق هذا الفيديو -->
  <section class="video-item">
    <video autoplay muted loop playsinline>
      <source src="video1.mp4" type="video/mp4">
    </video>

    <div class="actions">
      <button class="action-btn">❤️</button>
      <button class="action-btn">💬</button>
      <button class="action-btn">🔗</button>
    </div>
  </section>

  <!-- فيديو ثاني -->
  <section class="video-item">
    <video autoplay muted loop playsinline>
      <source src="video2.mp4" type="video/mp4">
    </video>

    <div class="actions">
      <button class="action-btn">❤️</button>
      <button class="action-btn">💬</button>
      <button class="action-btn">🔗</button>
    </div>
  </section>

</div>

</body>
<style>
.top-bar{
position:fixed;
top:10px;
left:0;
width:100%;
display:flex;
justify-content:space-between;
padding:0 15px;
z-index:999;
pointer-events:none;
}

.btn{
pointer-events:auto;
border:none;
padding:10px 14px;
border-radius:25px;
font-size:14px;
color:#fff;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
cursor:pointer;
}

.profile-btn{
background:rgba(59,130,246,0.7);
}

.upload-btn{
background:rgba(34,197,94,0.7);
}
*{
margin:0;
padding:0;
box-sizing:border-box;
}
<!-- الأزرار العلوية -->
<div class="top-bar">

  <button class="btn profile-btn">👤 الملف الشخصي</button>

  <button class="btn upload-btn">+ رفع فيديو</button>

</div>
body{
background:#000;
overflow:hidden;
}

.feed{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

.video-item{
height:100vh;
width:100%;
scroll-snap-align:start;
position:relative;
}

.video-item video{
width:100%;
height:100%;
object-fit:cover;
}

/* طبقة فوق الفيديو */
.overlay{
position:absolute;
bottom:20px;
right:15px;
color:#fff;
font-size:18px;
}

</style>
</head>

<body>

<div class="feed">

  <section class="video-item">
    <video autoplay muted loop playsinline>
      <source src="video1.mp4" type="video/mp4">
    </video>
    <div class="overlay">⭐ نجم</div>
  </section>

  <section class="video-item">
    <video autoplay muted loop playsinline>
      <source src="video2.mp4" type="video/mp4">
    </video>
    <div class="overlay">❤️ إعجاب</div>
  </section>

  <section class="video-item">
    <video autoplay muted loop playsinline>
      <source src="video3.mp4" type="video/mp4">
    </video>
    <div class="overlay">👁 مشاهدة</div>
  </section>

</div>

</body>
</html>
