<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توفير - الفيديوهات</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui,sans-serif;
}

html,body{
height:100%;
overflow:hidden;
background:#000;
}

/* حاوية الفيديوهات */

.video-container{
height:100vh;
overflow-y:auto;
scroll-snap-type:y mandatory;
scrollbar-width:none;
}

.video-container::-webkit-scrollbar{
display:none;
}

/* الفيديو */

.video-slide{
position:relative;
height:100vh;
width:100%;
scroll-snap-align:start;
overflow:hidden;
background:#000;
}

.video-slide video{
width:100%;
height:100%;
object-fit:cover;
}

/* تدرج سفلي */

.video-slide::after{
content:"";
position:absolute;
left:0;
right:0;
bottom:0;
height:40%;
background:linear-gradient(
to top,
rgba(0,0,0,.95),
rgba(0,0,0,.4),
transparent
);
pointer-events:none;
}

/* معلومات المستخدم */

.info{
position:absolute;
bottom:25px;
right:15px;
z-index:10;
color:#fff;
max-width:70%;
}

.info h3{
font-size:18px;
margin-bottom:8px;
}

.info p{
font-size:14px;
line-height:1.6;
}

/* الأزرار الجانبية */

.sidebar{
position:absolute;
left:15px;
bottom:110px;
z-index:10;
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
}

/* صورة الحساب */

.profile-pic{
width:58px;
height:58px;
border-radius:50%;
border:3px solid #fff;
object-fit:cover;
}

/* عنصر */

.action{
display:flex;
flex-direction:column;
align-items:center;
color:#fff;
}

/* زر */

.action-btn{
width:58px;
height:58px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
color:#fff;
font-size:26px;
cursor:pointer;
transition:.25s;
}

.action-btn:active{
transform:scale(.92);
}

.action span{
margin-top:5px;
font-size:13px;
}

/* زر إضافة فيديو */

.add-video{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:62px;
height:62px;
border:none;
border-radius:18px;
background:#fff;
color:#000;
font-size:38px;
font-weight:bold;
cursor:pointer;
z-index:100;
box-shadow:0 8px 25px rgba(255,255,255,.25);
}

</style>
</head>
<body>

<div class="video-container">

<!-- فيديو 1 -->

<div class="video-slide">

<video autoplay muted loop playsinline>
<source src="video1.mp4" type="video/mp4">
</video>

<div class="info">
<h3>@Mohammad</h3>
<p>
أول فيديو داخل التطبيق 🚀
#توفير #فيديوهات
</p>
</div>

<div class="sidebar">

<img src="https://i.pravatar.cc/150?img=5" class="profile-pic">

<div class="action">
<button class="action-btn">❤️</button>
<span>1.2K</span>
</div>

<div class="action">
<button class="action-btn">💬</button>
<span>320</span>
</div>

<div class="action">
<button class="action-btn">↗</button>
<span>مشاركة</span>
</div>

</div>

</div>

<!-- فيديو 2 -->

<div class="video-slide">

<video autoplay muted loop playsinline>
<source src="video2.mp4" type="video/mp4">
</video>

<div class="info">
<h3>@User</h3>
<p>
فيديو جديد داخل التطبيق 🔥
</p>
</div>

<div class="sidebar">

<img src="https://i.pravatar.cc/150?img=8" class="profile-pic">

<div class="action">
<button class="action-btn">❤️</button>
<span>870</span>
</div>

<div class="action">
<button class="action-btn">💬</button>
<span>150</span>
</div>

<div class="action">
<button class="action-btn">↗</button>
<span>مشاركة</span>
</div>

</div>

</div>

</div>

<button class="add-video">+</button>

<script>

const videos=document.querySelectorAll("video");

const observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.play();

}else{

entry.target.pause();

}

});

},{threshold:0.7});

videos.forEach(video=>{
observer.observe(video);
});

</script>

</body>
</html>
