<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نجم</title>

<style>
.fab{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:60px;
height:60px;
border-radius:50%;
border:none;
background:#22c55e;
color:#fff;
font-size:32px;
font-weight:bold;
z-index:9999;
box-shadow:0 10px 20px rgba(0,0,0,0.4);
cursor:pointer;
}

.fab:active{
transform:translat
body{
margin:0;
background:#000;
overflow:hidden;
}

.video-item{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

/* الأزرار */
.actions{
position:absolute;
right:15px;
bottom:120px;
display:flex;
flex-direction:column;
gap:15px;
z-index:10;
}

.action-btn{
width:50px;
height:50px;
border-radius:50%;
border:none;
background:rgba(0,0,0,0.5);
color:#fff;
font-size:20px;
}

.top-bar{
position:fixed;
top:10px;
left:0;
width:100%;
display:flex;
justify-content:space-between;
padding:0 15px;
z-index:999;
}

.btn{
padding:10px 14px;
border:none;
border-radius:20px;
background:rgba(255,255,255,0.2);
color:#fff;
}

</style>
</head>

<body>

<!-- الأزرار العلوية -->
<div class="top-bar">
  <button class="btn">👤 الملف الشخصي</button>
  <button class="btn">+ رفع فيديو</button>
</div>

<!-- الفيديو -->
<div class="video-item">

  <video autoplay muted loop playsinline>
    <source src="video1.mp4" type="video/mp4">
  </video>

  <div class="actions">
    <button class="action-btn">❤️</button>
    <button class="action-btn">💬</button>
    <button class="action-btn">🔗</button>
  </div>

</div>
<!-- زر الإضافة في الأسفل -->
<button class="fab">+</button>
</body>
</html>
