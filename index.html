؟<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توفير</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui,sans-serif;
}

html,body{
height:100%;
overflow:hidden;
background:#000;
}

.video-container{
height:100vh;
overflow-y:auto;
scroll-snap-type:y mandatory;
scrollbar-width:none;
}

.video-container::-webkit-scrollbar{
display:none;
}

.video-slide{
position:relative;
height:100vh;
width:100%;
scroll-snap-align:start;
overflow:hidden;
background:#000;
}

.video-slide video{
width:100%;
height:100%;
object-fit:cover;
}

.video-slide::after{
content:"";
position:absolute;
left:0;
right:0;
bottom:0;
height:40%;
background:linear-gradient(
to top,
rgba(0,0,0,.95),
rgba(0,0,0,.5),
transparent
);
pointer-events:none;
}

.info{
position:absolute;
bottom:25px;
right:15px;
z-index:10;
color:#fff;
max-width:70%;
}

.info h3{
font-size:18px;
margin-bottom:8px;
}

.info p{
font-size:14px;
line-height:1.5;
}

.sidebar{
position:absolute;
left:15px;
bottom:100px;
z-index:10;
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
}

.profile-pic{
width:60px;
height:60px;
border-radius:50%;
border:3px solid #fff;
object-fit:cover;
}

.action{
display:flex;
flex-direction:column;
align-items:center;
color:#fff;
}

.action-btn{
width:58px;
height:58px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
color:#fff;
font-size:26px;
cursor:pointer;
transition:.25s;
}

.action-btn:active{
transform:scale(.9);
}

.action span{
margin-top:5px;
font-size:13px;
}

.add-btn{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:65px;
height:65px;
border:none;
border-radius:18px;
background:#fff;
color:#000;
font-size:40px;
font-weight:bold;
cursor:pointer;
z-index:1000;
box-shadow:0 10px 30px rgba(255,255,255,.25);
}

</style>
</head>
<body>

<div class="video-container"></div>

<button class="add-btn">+</button>

<script>

const videoData = [

{
user:"Mohammad",
video:"video1.mp4",
likes:"1.2K",
comments:"320",
caption:"أول فيديو داخل التطبيق 🚀"
},

{
user:"Ahmed",
video:"video2.mp4",
likes:"870",
comments:"150",
caption:"فيديو جديد 🔥"
},

{
user:"Ali",
video:"video3.mp4",
likes:"500",
comments:"90",
caption:"مرحبا بكم في توفير ❤️"
}

];

const container=document.querySelector(".video-container");

videoData.forEach(v=>{

const slide=document.createElement("div");

slide.className="video-slide";

slide.innerHTML=`

<video loop muted playsinline>
<source src="${v.video}" type="video/mp4">
</video>

<div class="info">
<h3>@${v.user}</h3>
<p>${v.caption}</p>
</div>

<div class="sidebar">

<img src="https://i.pravatar.cc/150?u=${v.user}" class="profile-pic">

<div class="action">
<button class="action-btn like-btn">❤️</button>
<span>${v.likes}</span>
</div>

<div class="action">
<button class="action-btn">💬</button>
<span>${v.comments}</span>
</div>

<div class="action">
<button class="action-btn">↗</button>
<span>مشاركة</span>
</div>

</div>

`;

container.appendChild(slide);

});

const observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.play();

}else{

entry.target.pause();

}

});

},{threshold:0.7});

document.addEventListener("click", e => {
    if (e.target.classList.contains("like-btn")) {
        const isLiked = e.target.dataset.liked;
        
        if (isLiked) {
            e.target.dataset.liked = "";
            e.target.style.transform = "scale(1)";
            e.target.style.color = "#fff"; // اللون الأصلي
        } else {
            e.target.dataset.liked = "1";
            e.target.style.transform = "scale(1.2)";
            e.target.style.color = "#ff4d4d"; // لون أحمر عند الإعجاب
        }
    }
});
</script>

</body>
</html>
