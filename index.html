<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توفير</title>

<style>
  .action-btn{
    width:52px;
    height:52px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    color:#fff;
    font-size:22px;
    cursor:pointer;
    transition:.3s;
}

/* قلب الإعجاب */
.like-btn.is-liked{
    color:#ff3040 !important;
    transform:scale(1.2);
}  
.like-btn { 
    transition: .25s; 
}


/* الأساسيات */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui,sans-serif;
}

html,body{
height:100%;
overflow:hidden;
background:#000;
}

/* الحاوية */
.video-container{
height:100vh;
overflow-y:auto;
scroll-snap-type:y mandatory;
scrollbar-width:none;
}

.video-container::-webkit-scrollbar{
display:none;
}

/* كل فيديو */
.video-slide{
position:relative;
height:100vh;
width:100%;
scroll-snap-align:start;
overflow:hidden;
}

.video-slide video{
width:100%;
height:100%;
object-fit:cover;
}

/* تدرج أسفل */
.video-slide::after{
content:"";
position:absolute;
left:0;
right:0;
bottom:0;
height:40%;
background:linear-gradient(to top, rgba(0,0,0,.95), transparent);
}

/* معلومات */
.info{
position:absolute;
bottom:25px;
right:15px;
z-index:10;
color:#fff;
max-width:70%;
}

.info h3{
font-size:18px;
margin-bottom:8px;
}

.info p{
font-size:14px;
}

/* الأزرار (LEFT SIDE) */
.sidebar{
position:absolute;
left:15px;
bottom:100px;
z-index:10;
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
}

.profile-pic{
width:56px;
height:56px;
border-radius:50%;
border:2px solid #fff;
object-fit:cover;
}

.action{
display:flex;
flex-direction:column;
align-items:center;
color:#fff;
}

.action-btn:active{
transform:scale(.9);
}

.action span{
font-size:12px;
margin-top:4px;
}

/* زر الإضافة */
.add-btn{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:64px;
height:64px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#00c6ff,#7b61ff);
color:#fff;
font-size:34px;
font-weight:bold;
cursor:pointer;
z-index:9999;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

</style>
</head>

<body>

<div class="video-container"></div>

<button class="add-btn">+</button>

<script>

/* ===== 1. البيانات ===== */
const videos = [
    {user:"Mohammad", video:"video1.mp4", caption:"أول فيديو 🚀", likes:1200, comments:320},
    {user:"Ahmed", video:"video2.mp4", caption:"فيديو جديد 🔥", likes:870, comments:150}
];

/* ===== 2. بناء الواجهة ===== */
const container = document.querySelector(".video-container");

if (container) {
    videos.forEach(v => {
        container.insertAdjacentHTML("beforeend", `
            <div class="video-slide">
                <video loop muted playsinline>
                    <source src="${v.video}" type="video/mp4">
                </video>
                <div class="info"><h3>@${v.user}</h3><p>${v.caption}</p></div>
                <div class="sidebar">
                    <img src="https://i.pravatar.cc/150?u=${v.user}" class="profile-pic">
                    <div class="action">
                        <button type="button" class="action-btn like-btn">❤</button>
                        <span>${v.likes}</span>
                    </div>
                    <div class="action">
                        <button class="action-btn">💬</button>
                        <span>${v.comments}</span>
                    </div>
                    <div class="action">
                        <button class="action-btn">↗</button>
                        <span>مشاركة</span>
                    </div>
                </div>
            </div>
        `);
    });
}
/* ===== الإعجاب ===== */
  document.addEventListener("click", function(e){

    const btn = e.target.closest(".like-btn");

    if(!btn) return;

    btn.classList.toggle("is-liked");

    console.log("Like Clicked");

});
console.log("JavaScript Working");  
</script>

</body>
</html>
