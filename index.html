     <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توفير</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

html,body{
height:100%;
overflow:hidden;
background:#000;
}

/* ===== Top Bar ===== */
.top-bar{
position:fixed;
top:10px;
left:10px;
right:10px;
z-index:9999;
display:flex;
justify-content:space-between;
align-items:center;
color:#fff;
}

.user-box{
display:flex;
align-items:center;
gap:10px;
}

.user-box img{
width:35px;
height:35px;
border-radius:50%;
}

#editUser{
border:none;
padding:8px 12px;
border-radius:10px;
background:#00c6ff;
cursor:pointer;
}

/* ===== Video ===== */
.video-container{
height:100vh;
overflow-y:auto;
scroll-snap-type:y mandatory;
scrollbar-width:none;
}

.video-container::-webkit-scrollbar{display:none;}

.video-slide{
position:relative;
height:100vh;
scroll-snap-align:start;
}

.video-slide video{
width:100%;
height:100%;
object-fit:cover;
}

.info{
position:absolute;
bottom:25px;
right:15px;
color:#fff;
max-width:70%;
}

/* ===== Sidebar ===== */
.sidebar{
position:absolute;
left:15px;
bottom:120px;
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
}

.profile-pic{
width:56px;
height:56px;
border-radius:50%;
border:2px solid #fff;
}

/* ===== Buttons ===== */
.action-btn{
width:52px;
height:52px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.12);
color:#fff;
cursor:pointer;
}

.like-btn.is-liked{
color:#ff3040;
transform:scale(1.2);
}

/* ===== Add Button ===== */
.add-btn{
position:fixed;
bottom:16px;
left:50%;
transform:translateX(-50%);
width:42px;
height:42px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00f0ff,#fff,#ff2d7a);
cursor:pointer;
font-size:24px;
}

/* ===== Comments ===== */
.comments-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
align-items:flex-end;
z-index:99999;
}

.comments-modal.active{
display:flex;
}

.comments-box{
width:100%;
height:70vh;
background:#fff;
border-radius:25px 25px 0 0;
display:flex;
flex-direction:column;
}

.comments-header{
padding:18px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
}

.comments-list{
flex:1;
overflow:auto;
padding:15px;
}

.comment{
margin-bottom:15px;
}

.comment-input{
display:flex;
gap:10px;
padding:15px;
border-top:1px solid #eee;
}

.comment-input input{
flex:1;
padding:12px;
border:none;
background:#f3f3f3;
border-radius:14px;
}

.comment-input button{
border:none;
background:#0084ff;
color:#fff;
padding:12px 18px;
border-radius:14px;
}
</style>
</head>

<body>

<div class="top-bar">
<div class="user-box">
<img id="userAvatar" src="https://i.pravatar.cc/100">
<span id="userName">زائر</span>
</div>
<button id="editUser">تغيير الحساب</button>
</div>

<div class="video-container"></div>
<button class="add-btn">+</button>

<!-- ===== Comments ===== -->
<div class="comments-modal">
<div class="comments-box">

<div class="comments-header">
<h3>التعليقات</h3>
<button id="closeComments">✕</button>
</div>

<div class="comments-list" id="commentsList"></div>

<div class="comment-input">
<input id="commentInput" placeholder="اكتب تعليقاً...">
<button id="sendComment">إرسال</button>
</div>

</div>
</div>

<script>

/* ===== Data ===== */
const videos = [
{user:"Mohammad", video:"video1.mp4", caption:"أول فيديو 🚀", likes:1200},
{user:"Ahmed", video:"video2.mp4", caption:"فيديو جديد 🔥", likes:870}
];

/* ===== Build ===== */
const container = document.querySelector(".video-container");

videos.forEach(v=>{
container.insertAdjacentHTML("beforeend",`
<div class="video-slide">
<video loop muted playsinline>
<source src="${v.video}">
</video>

<div class="info">
<h3>@${v.user}</h3>
<p>${v.caption}</p>
</div>

<div class="sidebar">
<img class="profile-pic" src="https://i.pravatar.cc/150?u=${v.user}">
<button class="action-btn like-btn">❤</button>
<button class="action-btn comment-btn">💬</button>
<button class="action-btn">↗</button>
</div>

</div>
`);
});

/* ===== User ===== */
let currentUser = localStorage.getItem("username") || "زائر";

document.getElementById("userName").textContent = currentUser;

document.getElementById("editUser").onclick = () => {
const name = prompt("اكتب اسمك:");
if(!name) return;

currentUser = name.trim();
localStorage.setItem("username", currentUser);

document.getElementById("userName").textContent = currentUser;
document.getElementById("userAvatar").src =
"https://i.pravatar.cc/100?u=" + currentUser;
};

/* ===== Main Clicks ===== */
document.addEventListener("click",(e)=>{

const likeBtn = e.target.closest(".like-btn");
if(likeBtn){
likeBtn.classList.toggle("is-liked");
return;
}

const commentBtn = e.target.closest(".comment-btn");
if(commentBtn){
document.querySelector(".comments-modal").classList.add("active");
return;
}

const closeBtn = e.target.closest("#closeComments");
if(closeBtn){
document.querySelector(".comments-modal").classList.remove("active");
return;
}

});

/* ===== Comments ===== */
window.addEventListener("DOMContentLoaded",()=>{

document.getElementById("sendComment").onclick = ()=>{

const input = document.getElementById("commentInput");
const text = input.value.trim();

if(!text) return;

const div = document.createElement("div");
div.className="comment";
div.innerHTML=`<b>${currentUser}</b><p>${text}</p>`;

document.getElementById("commentsList").appendChild(div);

input.value="";
input.focus();

};

});

</script>

</body>
</html>
