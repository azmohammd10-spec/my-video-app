<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توفير</title>

<style>
  .top-bar{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:9999;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
}

.user-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-box img{
    width:35px;
    height:35px;
    border-radius:50%;
}

#editUser{
    border:none;
    padding:8px 12px;
    border-radius:10px;
    background:#00c6ff;
    color:#000;
    cursor:pointer;
}

  .action-btn{
    width:52px;
    height:52px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    color:#fff;
    font-size:22px;
    cursor:pointer;
    transition:.3s;
}

/* قلب الإعجاب */
.like-btn.is-liked{
    color:#ff3040 !important;
    transform:scale(1.2);
}  
.like-btn { 
    transition: .25s; 
}


/* الأساسيات */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui,sans-serif;
}

html,body{
height:100%;
overflow:hidden;
background:#000;
}

/* الحاوية */
.video-container{
height:100vh;
overflow-y:auto;
scroll-snap-type:y mandatory;
scrollbar-width:none;
}

.video-container::-webkit-scrollbar{
display:none;
}

/* كل فيديو */
.video-slide{
position:relative;
height:100vh;
width:100%;
scroll-snap-align:start;
overflow:hidden;
}

.video-slide video{
width:100%;
height:100%;
object-fit:cover;
}

/* تدرج أسفل */
.video-slide::after{
content:"";
position:absolute;
left:0;
right:0;
bottom:0;
height:40%;
background:linear-gradient(to top, rgba(0,0,0,.95), transparent);
}

/* معلومات */
.info{
position:absolute;
bottom:25px;
right:15px;
z-index:10;
color:#fff;
max-width:70%;
}

.info h3{
font-size:18px;
margin-bottom:8px;
}

.info p{
font-size:14px;
}

/* الأزرار (LEFT SIDE) */
.sidebar{
    position:absolute;
    left:15px;
    bottom:120px;
    z-index:9999; /* مهم جدًا */
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
}

.profile-pic{
width:56px;
height:56px;
border-radius:50%;
border:2px solid #fff;
object-fit:cover;
}

.action{
display:flex;
flex-direction:column;
align-items:center;
color:#fff;
}

.action-btn:active{
transform:scale(.9);
}

.action span{
font-size:12px;
margin-top:4px;
}

/* زر الإضافة */
.add-btn{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);

    width:42px;
    height:42px;

    border:none;
    border-radius:12px;

    background:linear-gradient(
        90deg,
        #00f0ff 0%,
        #ffffff 20%,
        #ffffff 80%,
        #ff2d7a 100%
    );

    color:#000;
    font-size:24px;
    font-weight:900;
    line-height:42px;

    cursor:pointer;
    z-index:9999;

    box-shadow:
        0 5px 15px rgba(0,0,0,.3),
        0 0 10px rgba(0,240,255,.25),
        0 0 10px rgba(255,45,122,.25);

    transition:.25s ease;
}

.add-btn:active{
    transform:translateX(-50%) scale(.9);
}

.add-btn:hover{
    transform:translateX(-50%) scale(1.05);
}

.add-btn:active{
    transform:translateX(-50%) scale(.92);
}
.comments-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:flex-end;
    z-index:99999;
}

.comments-modal.active{
    display:flex;
}

.comments-box{
    width:100%;
    height:70vh;
    background:#fff;
    border-radius:25px 25px 0 0;
    display:flex;
    flex-direction:column;
}

.comments-header{
    padding:18px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #eee;
}

.comments-list{
    flex:1;
    overflow:auto;
    padding:15px;
}

.comment{
    margin-bottom:15px;
}

.comment p{
    margin-top:4px;
}

.comment-input{
    display:flex;
    gap:10px;
    padding:15px;
    border-top:1px solid #eee;
}

.comment-input input{
    flex:1;
    border:none;
    background:#f3f3f3;
    border-radius:14px;
    padding:12px;
}

.comment-input button{
    border:none;
    background:#0084ff;
    color:#fff;
    border-radius:14px;
    padding:12px 18px;
}
</style>
</head>

<body>
<div class="top-bar">
    <div class="user-box">
        <img id="userAvatar" src="https://i.pravatar.cc/100" />
        <span id="userName">زائر</span>
    </div>

    <button id="editUser">تغيير الحساب</button>
</div>
<div class="video-container"></div>

<button class="add-btn">+</button>

<script>

/* ===== 1. البيانات ===== */
const videos = [
    {user:"Mohammad", video:"video1.mp4", caption:"أول فيديو 🚀", likes:1200, comments:320},
    {user:"Ahmed", video:"video2.mp4", caption:"فيديو جديد 🔥", likes:870, comments:150}
];

/* ===== 2. بناء الواجهة ===== */
const container = document.querySelector(".video-container");

if (container) {
    videos.forEach(v => {
        container.insertAdjacentHTML("beforeend", `
            <div class="video-slide">
                <video loop muted playsinline>
                    <source src="${v.video}" type="video/mp4">
                </video>
                <div class="info"><h3>@${v.user}</h3><p>${v.caption}</p></div>
                <div class="sidebar">
                    <img src="https://i.pravatar.cc/150?u=${v.user}" class="profile-pic">
                    <div class="action">
                        <button type="button" class="action-btn like-btn">❤</button>
                        <span>${v.likes}</span>
                    </div>
                    <div class="action">
                       <button class="action-btn comment-btn">💬</button> 
                        <span>${v.comments}</span>
                    </div>
                    <div class="action">
                        <button class="action-btn">↗</button>
                        <span>مشاركة</span>
                    </div>
                </div>
            </div>
        `);
    });
}
  /* ===== الإعجاب ===== */
document.addEventListener("click", (e) => {

    const likeBtn = e.target.closest(".like-btn");
    if(likeBtn){
        likeBtn.classList.toggle("is-liked");
        return;
    }

    const commentBtn = e.target.closest(".comment-btn");
    if(commentBtn){
        document.querySelector(".comments-modal").classList.add("active");
        return;
    }

    const closeBtn = e.target.closest("#closeComments");
    if(closeBtn){
        document.querySelector(".comments-modal").classList.remove("active");
        return;
    }

});

/* إغلاق التعليقات */
document.getElementById("closeComments").onclick = () => {
    document.querySelector(".comments-modal").classList.remove("active");
};

/* إضافة تعليق */
document.getElementById("sendComment").onclick = () => {

    const input = document.getElementById("commentInput");

    if(input.value.trim() === "") return;

    const div = document.createElement("div");

    div.className = "comment";

    div.innerHTML = `
       <b>${currentUser}</b> 
        <p>${input.value}</p>
    `;

    /* ===== المستخدم ===== */
let currentUser = localStorage.getItem("username") || "زائر";

document.getElementById("userName").textContent = currentUser;

/* تغيير الحساب */
document.getElementById("editUser").onclick = () => {
    const name = prompt("اكتب اسمك:");

    if (!name || name.trim() === "") return;

    currentUser = name;

    localStorage.setItem("username", currentUser);

    document.getElementById("userName").textContent = currentUser;

    document.getElementById("userAvatar").src =
        "https://i.pravatar.cc/100?u=" + currentUser;
};


/* ===== التفاعل العام (لايك + تعليق + إغلاق) ===== */
document.addEventListener("click", (e) => {

    const likeBtn = e.target.closest(".like-btn");
    if (likeBtn) {
        likeBtn.classList.toggle("is-liked");
        return;
    }

    const commentBtn = e.target.closest(".comment-btn");
    if (commentBtn) {
        document.querySelector(".comments-modal").classList.add("active");
        return;
    }

    const closeBtn = e.target.closest("#closeComments");
    if (closeBtn) {
        document.querySelector(".comments-modal").classList.remove("active");
        return;
    }

});


/* ===== إرسال تعليق ===== */
document.getElementById("sendComment").onclick = () => {

    const input = document.getElementById("commentInput");

    if (input.value.trim() === "") return;

    const div = document.createElement("div");

    div.className = "comment";

    div.innerHTML = `
        <b>${currentUser}</b>
        <p>${input.value}</p>
    `;

    document.getElementById("commentsList").appendChild(div);

    input.value = "";
};
</body>
</html>
