<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نجم</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>

body{
margin:0;
background:#000;
font-family:Tahoma;
overflow:hidden;
}

/* تسجيل الدخول */
.auth{
position:fixed;
inset:0;
background:#0f172a;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:10px;
z-index:9999;
}

.auth input{
padding:10px;
border:none;
border-radius:10px;
width:200px;
}

.auth button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#22c55e;
color:#fff;
}

/* الفيديو */
.feed{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

.video-item{
height:100vh;
position:relative;
scroll-snap-align:start;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

/* التفاعل */
.actions{
position:absolute;
right:15px;
bottom:120px;
display:flex;
flex-direction:column;
gap:12px;
}

.actions button{
width:50px;
height:50px;
border-radius:50%;
border:none;
background:rgba(0,0,0,0.5);
color:#fff;
font-size:18px;
}

/* أعلى */
.top-bar{
position:fixed;
top:10px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 15px;
z-index:999;
}

.btn{
padding:8px 12px;
border:none;
border-radius:20px;
background:rgba(255,255,255,0.2);
color:#fff;
}

/* زر + */
.fab{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:65px;
height:65px;
border-radius:50%;
background:linear-gradient(135deg,#25f4ee,#fe2c55);
color:#fff;
font-size:30px;
border:none;
z-index:999;
}

</style>
</head>

<body>

<!-- تسجيل الدخول -->
<div class="auth" id="auth">
  <h2 style="color:white;">نجم</h2>
  <input id="email" placeholder="الإيميل">
  <input id="password" placeholder="كلمة المرور" type="password">
  <button onclick="login()">دخول / تسجيل</button>
</div>

<!-- أعلى -->
<div class="top-bar">
  <button class="btn">👤 الحساب</button>
  <button class="btn">+ رفع</button>
</div>
