<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نجم</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
}

.feed{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

.video-item{
height:100vh;
width:100%;
scroll-snap-align:start;
position:relative;
}

.video-item video{
width:100%;
height:100%;
object-fit:cover;
}

/* طبقة فوق الفيديو */
.overlay{
position:absolute;
bottom:20px;
right:15px;
color:#fff;
font-size:18px;
}

</style>
</head>

<body>

<div class="feed">

  <section class="video-item">
    <video autoplay muted loop playsinline>
      <source src="video1.mp4" type="video/mp4">
    </video>
    <div class="overlay">⭐ نجم</div>
  </section>

  <section class="video-item">
    <video autoplay muted loop playsinline>
      <source src="video2.mp4" type="video/mp4">
    </video>
    <div class="overlay">❤️ إعجاب</div>
  </section>

  <section class="video-item">
    <video autoplay muted loop playsinline>
      <source src="video3.mp4" type="video/mp4">
    </video>
    <div class="overlay">👁 مشاهدة</div>
  </section>

</div>

</body>
</html>
